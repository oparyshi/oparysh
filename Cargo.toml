[workspace]
resolver = "2"
members = [
    "crates/oparysh-cli",
    "crates/oparysh-core",
    "crates/oparysh-resolver",
    "crates/oparysh-fetcher",
    "crates/oparysh-verifier",
    "crates/oparysh-builder",
    "crates/oparysh-installer",
    "crates/oparysh-db",
    "crates/oparysh-repo",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
# CLI
clap = { version = "4", features = ["derive"] }
# модели/сериализация
serde = { version = "1", features = ["derive"] }
toml = "0.9"
# хэширование
sha2 = "0.10"
hex = "0.4"
# базы данных
rusqlite = { version = "0.37", features = ["bundled", "backup"] }
# сеть (синхронный HTTP-клиент)
ureq = { version = "3", features = ["gzip"] }
# ошибки
anyhow = "1"
thiserror = "2"

# flock для advisory-lock БД (этап 3.4)
libc = "0.2"

# oparysh crates (внутренние)
oparysh-core = { path = "crates/oparysh-core" }
oparysh-verifier = { path = "crates/oparysh-verifier" }
oparysh-db = { path = "crates/oparysh-db" }
